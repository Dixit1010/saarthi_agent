packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - "@google/genai"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "protobufjs"
  - "sharp"
